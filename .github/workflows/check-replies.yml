name: Check For Lead Replies

concurrency: check-replies

on:
  schedule:
    # Hourly, ~8am-7pm ET every day, so replies get answered fast (a new
    # reply emails Deven an alert). Staggered off :00 for cron congestion.
    - cron: '17 12-23 * * *'
  workflow_dispatch: {}

jobs:
  check-replies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "enterprise-leads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check-replies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
