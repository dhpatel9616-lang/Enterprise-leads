name: Enrich Lead Emails

on:
  schedule:
    - cron: '24 12 * * 1-5' # ~8:24am ET, Mon-Fri (staggered off :10 to avoid GH Actions cron congestion)
  workflow_dispatch: {}

jobs:
  enrich:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "enterprise-leads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run enrich
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
