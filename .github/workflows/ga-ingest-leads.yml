name: GlobalAggregate — Ingest Leads

on:
  schedule:
    - cron: '41 12 * * 1-5' # ~8:41am ET, Mon-Fri (staggered off :15 to avoid GH Actions cron congestion)
  workflow_dispatch: {}

jobs:
  ga-ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "enterprise-leads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run ga-ingest
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
