name: Send Outreach Touches

on:
  schedule:
    - cron: '34 13 * * 1-5' # ~9:34am ET, Mon-Fri (staggered off :00 to avoid GH Actions cron congestion)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only: log what would send, send nothing'
        type: boolean
        default: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "enterprise-leads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Podcast guests marked Ready in Notion join the queue first (ingest/podcast-guests.js).
      # A Notion hiccup here must never stop the business emails below.
      - run: npm run podcast-guests
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          PODCAST_GUESTS_DB: 11c77d7cb8ca4a37a6eebf7cd7e0d0ef
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      - run: npm run outreach
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
